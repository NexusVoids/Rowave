<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RoWave</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --panel: rgba(18, 22, 31, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f4f8;
      --text-dim: #94a3b8;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.25);
      --discord-blurple: #5865F2;
      --discord-hover: #4752C4;
      --font-display: 'Sora', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-md: 10px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Background Effects */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(88, 101, 242, 0.1) 0%, transparent 70%);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
    }

    .input-group input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-group input:focus {
      border-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-discord {
      background: var(--discord-blurple);
      color: white;
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.3);
    }

    .btn-discord:hover {
      background: var(--discord-hover);
      box-shadow: 0 0 25px rgba(88, 101, 242, 0.5);
    }

    .btn-discord svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      margin: 20px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }

    .back-home {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-home:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- Background Lighting Effects -->
  <div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
  </div>

  <div class="login-card">
    <h1 class="brand-title">Welcome to RoWave</h1>
    <p class="brand-sub">Authenticate to access your Roblox communities</p>

    <!-- Simulated Login Form (Stores session locally for demo/testing) -->
    <form class="login-form" id="loginForm">
      <div class="input-group">
        <label for="username">Roblox / Display Username</label>
        <input type="text" id="username" placeholder="e.g. BuilderDeveloper" required>
      </div>
      <button type="submit" class="btn" style="background: var(--accent); color: #050811;">Continue to Dashboard</button>
    </form>

    <div class="divider">or connect with</div>

    <!-- Official Discord Login Button Style -->
    <a href="communities.html" class="btn btn-discord" id="discordLoginBtn">
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.68,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.65-27.28-4.43-51.1-20.49-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.44-12.72S96.14,46,96.12,53,90.95,65.69,84.69,65.69Z"/>
      </svg>
      Login with Discord
    </a>

    <div>
      <a href="index.html" class="back-home">&larr; Back to Home</a>
    </div>
  </div>

  <script>
    // Simple script to save the username to localStorage for session tracking across pages
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      if (username) {
        localStorage.setItem("rowave_user", JSON.stringify({ username: username }));
        window.location.href = "communities.html";
      }
    });

    // Handle Discord click demo session
    document.getElementById("discordLoginBtn").addEventListener("click", () => {
      localStorage.setItem("rowave_user", JSON.stringify({ username: "DiscordUser" }));
    });
  </script>
</body>
</html>
