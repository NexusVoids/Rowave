<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | RoWave</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --panel: rgba(18, 22, 31, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f4f8;
      --text-dim: #94a3b8;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.25);
      --font-display: 'Sora', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Background Effects */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, transparent 70%);
    }

    .not-found-container {
      max-width: 500px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .wave-graphic {
      font-size: 54px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #050811;
      box-shadow: 0 0 15px var(--accent-glow);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 25px var(--accent-glow);
    }
  </style>
</head>
<body>

  <!-- Background Layer -->
  <div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
  </div>

  <div class="not-found-container">
    <div class="wave-graphic" aria-hidden="true">🌊</div>
    <h1>404 PAGE NOT FOUND</h1>
    <p>Looks like you wiped out and caught the wrong wave! The page you're looking for doesn't exist or has been moved.</p>
    <a href="index.html" class="btn">Return to Shore :D</a>
  </div>

</body>
</html>
