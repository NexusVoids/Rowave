<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communities - RoWave Dashboard</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --panel: rgba(18, 22, 31, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f4f8;
      --text-dim: #94a3b8;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.25);
      --font-display: 'Sora', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-md: 10px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Background Effects */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Dashboard Header */
    .dash-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(12px);
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
      color: var(--text-dim);
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .section-sub {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* Groups Grid */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .group-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .group-card:hover {
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .group-avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: rgba(0, 240, 255, 0.1);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-weight: bold;
      font-family: var(--font-display);
    }

    .group-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
    }

    .group-members {
      font-size: 13px;
      color: var(--text-dim);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #050811;
      box-shadow: 0 0 12px var(--accent-glow);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 20px var(--accent-glow);
    }
  </style>
</head>
<body>

  <!-- Background Layer -->
  <div class="bg-layer">
    <div class="bg-grid"></div>
  </div>

  <!-- Dashboard Navigation -->
  <header class="dash-nav">
    <a href="index.html" class="brand-logo">RoWave</a>
    <div class="user-info">
      <span id="welcomeUser">Logged in as: Loading...</span>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <h1 class="section-title">Your Roblox Communities</h1>
    <p class="section-sub">Select a group below to manage ranks, tools, and operations.</p>

    <div class="groups-grid">
      <!-- Example Group Card 1 -->
      <div class="group-card">
        <div class="group-header">
          <div class="group-avatar">RW</div>
          <div>
            <div class="group-name">RoWave Development</div>
            <div class="group-members">1,420 Members • Owner</div>
          </div>
        </div>
        <a href="#" class="btn">Manage Group</a>
      </div>

      <!-- Example Group Card 2 -->
      <div class="group-card">
        <div class="group-header">
          <div class="group-avatar" style="background: rgba(120,0,255,0.1); color: #b180ff;">SF</div>
          <div>
            <div class="group-name">Surfer Cafe & Resort</div>
            <div class="group-members">8,950 Members • Administrator</div>
          </div>
        </div>
        <a href="#" class="btn">Manage Group</a>
      </div>
    </div>
  </main>

  <script>
    // Check if user is logged in using localStorage from login.html
    const savedUser = localStorage.getItem("rowave_user");
    if (!savedUser) {
      // If not logged in, kick them back to login page
      window.location.href = "login.html";
    } else {
      const userObj = JSON.parse(savedUser);
      document.getElementById("welcomeUser").textContent = `Logged in as: ${userObj.username}`;
    }

    // Handle logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("rowave_user");
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
