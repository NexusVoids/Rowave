<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communities - RoWave Dashboard</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --panel: rgba(18, 22, 31, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f4f8;
      --text-dim: #94a3b8;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.25);
      --font-display: 'Sora', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-md: 10px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Background Effects */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Dashboard Header */
    .dash-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(12px);
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
      color: var(--text-dim);
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .section-sub {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* Groups Grid */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .group-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .group-card:hover {
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .group-logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(0, 240, 255, 0.1);
      border: 2px solid var(--border);
    }

    .group-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
    }

    /* Create Organization Card Style */
    .create-card {
      border: 2px dashed var(--border);
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      min-height: 200px;
    }

    .create-card:hover {
      border-color: var(--accent);
      background: rgba(0, 240, 255, 0.02);
    }

    .create-icon {
      font-size: 32px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #050811;
      box-shadow: 0 0 12px var(--accent-glow);
      text-decoration: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 20px var(--accent-glow);
    }
  </style>
</head>
<body>

  <!-- Background Layer -->
  <div class="bg-layer">
    <div class="bg-grid"></div>
  </div>

  <!-- Dashboard Navigation -->
  <header class="dash-nav">
    <a href="index.html" class="brand-logo">RoWave</a>
    <div class="user-info">
      <span id="welcomeUser">Logged in as: Loading...</span>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <h1 class="section-title">Your Communities</h1>
    <p class="section-sub">Manage your verified organizations and groups below.</p>

    <!-- Dynamic Grid of Real Communities + Create Organization Card -->
    <div class="groups-grid" id="groupsGrid">
      <!-- Communities will be injected dynamically via JavaScript -->

      <!-- Create Organization Card -->
      <div class="group-card create-card" id="createOrgBtn">
        <div class="create-icon">+</div>
        <div class="group-name">Create Organization</div>
        <p style="font-size: 12px; color: var(--text-dim); margin-bottom: 8px;">Launch a new group hub</p>
      </div>
    </div>
  </main>

  <script>
    // 1. Session Validation
    const savedUser = localStorage.getItem("rowave_user");
    if (!savedUser) {
      window.location.href = "login.html";
    } else {
      const userObj = JSON.parse(savedUser);
      document.getElementById("welcomeUser").textContent = `Logged in as: ${userObj.username}`;
    }

    // Handle logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("rowave_user");
      window.location.href = "login.html";
    });

    // 2. Load Real/Saved User Communities (No Templates)
    const grid = document.getElementById("groupsGrid");
    const createCard = document.getElementById("createOrgBtn");

    // Fetch stored user organizations or initialize empty array
    let userCommunities = JSON.parse(localStorage.getItem("rowave_user_orgs")) || [];

    function renderCommunities() {
      // Remove existing dynamic community cards (keeping the create card)
      document.querySelectorAll(".dynamic-group-card").forEach(el => el.remove());

      if (userCommunities.length === 0) {
        // If user has no organizations yet, they can create one using the card
      }

      userCommunities.forEach((org, index) => {
        const card = document.createElement("div");
        card.className = "group-card dynamic-group-card";
        card.innerHTML = `
          <img src="${org.logoUrl || 'https://via.placeholder.com/72'}" alt="${org.name}" class="group-logo">
          <div class="group-name">${org.name}</div>
          <a href="manage.html?id=${index}" class="btn">Manage Hub</a>
        `;
        // Insert right before the create card
        grid.insertBefore(card, createCard);
      });
    }

    renderCommunities();

    // 3. Handle Create Organization Action
    createCard.addEventListener("click", () => {
      const orgName = prompt("Enter your new organization or Roblox group name:");
      if (orgName && orgName.trim() !== "") {
        const logoUrl = prompt("Enter image URL for your community logo (or leave blank for default):") || "https://via.placeholder.com/72";
        
        userCommunities.push({ name: orgName.trim(), logoUrl: logoUrl });
        localStorage.setItem("rowave_user_orgs", JSON.stringify(userCommunities));
        renderCommunities();
      }
    });
  </script>

</body>
</html>
